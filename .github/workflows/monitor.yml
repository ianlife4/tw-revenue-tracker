name: Revenue Monitor

on:
  push:
    branches: [main]
    paths: ['.github/workflows/monitor.yml']
  schedule:
    # 申報密集期 (每月 1~12 日)：每天 11 次密集更新
    # 台灣 06:00,08:30,10:00,12:00,14:00,15:00,16:00,18:00,20:00,22:00,24:00
    - cron: '0 2,4,6,7,8,10,12,14,16,22 1-12 * *'
    - cron: '30 0 1-12 * *'
    # 非申報期 (13~31 日)：每天 3 次基本更新 (晚到申報、修正)
    # 台灣 08:00, 14:00, 20:00
    - cron: '0 0,6,12 13-31 * *'
    # 每天 TW 06:30 跑 batch_scrape backfill 補完整月資料
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "monitor"
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pre-check (doctor)
        run: python doctor.py --ci

      # 每天 TW 06:30 (UTC 22:30) 跑 batch_scrape 補完整月資料
      # 用 schedule event 的 cron 字串判斷是否為 backfill 排程
      - name: Backfill (batch_scrape)
        if: github.event.schedule == '30 22 * * *'
        run: |
          # 取得當前 TW 年/月
          TW_DATE=$(TZ=Asia/Taipei date +%Y-%m)
          TW_YEAR=$(echo $TW_DATE | cut -d- -f1)
          TW_MONTH=$(echo $TW_DATE | cut -d- -f2 | sed 's/^0//')
          # 報告月份 = 當月 - 1
          if [ "$TW_MONTH" -eq 1 ]; then
            REPORT_YEAR=$((TW_YEAR - 1))
            REPORT_MONTH=12
          else
            REPORT_YEAR=$TW_YEAR
            REPORT_MONTH=$((TW_MONTH - 1))
          fi
          echo "Backfill: report month = $REPORT_YEAR/$REPORT_MONTH"
          # 補近 2 個月資料 (batch_scrape 內已自動 force refresh 最近 2 月)
          python batch_scrape.py $REPORT_YEAR $REPORT_MONTH 2

      - name: Run monitor
        id: monitor
        if: github.event.schedule != '30 22 * * *'
        run: python monitor.py

      - name: Diagnose failure (doctor)
        if: failure() && steps.monitor.outcome == 'failure'
        run: python doctor.py --ci-diagnose

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/ data/monitor_state.json data/t1_cache.json data/all_revenue_mops.csv
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "auto: update revenue filings $(date -u +%Y-%m-%d\ %H:%M)"
            if ! git pull --rebase; then
              git rebase --abort 2>/dev/null || true
              git pull --no-rebase --no-edit || true
            fi
            git push || echo "Push failed, will retry next run"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # 直接部署 GitHub Pages（不依賴另一個 workflow）
      - name: Setup Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'output'

      - name: Deploy to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        uses: actions/deploy-pages@v4

      # === 監督檢查 (每次跑完都做，異常發 TG 告警) ===
      - name: Health supervisor
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python supervisor.py --tg
